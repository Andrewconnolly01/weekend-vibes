<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weekend">
<meta name="theme-color" content="#042C53">
<title>Weekend Vibes</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#031B33;--deep:#042C53;--tide:#0C447C;--tide-2:#0E4D8C;--surf:#185FA5;--wave:#378ADD;
  --foam:#E6F1FB;--mist:#B5D4F4;--haze:#85B7EB;
  --sun:#EF9F27;--sun-soft:#FAC775;--sand:#FAEEDA;--bark:#412402;
  --mint:#5DCAA5;--mint-soft:#9FE1CB;--kelp:#04342C;
  --coral:#F09595;--ember:#501313;--grape:#CECBF6;--plum:#26215C;
  --display:'Bricolage Grotesque',ui-rounded,'SF Pro Rounded',-apple-system,system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);font-size:16px;line-height:1.45;color:var(--foam);
  background:linear-gradient(180deg,var(--deep) 0%,var(--night) 70%) fixed;background-color:var(--night);
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun-soft);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 120px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 14px}
.brand{display:flex;align-items:center;gap:12px}
.sunmark{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,var(--sun-soft) 0 45%,var(--sun) 46% 62%,transparent 63%);
  box-shadow:0 0 22px 6px rgba(239,159,39,.45);animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 34px 12px rgba(239,159,39,.6)}}
@media (prefers-reduced-motion:reduce){.sunmark{animation:none}.spin{animation:none!important}}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;margin:0;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--haze);margin-top:4px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--wave);background:transparent;color:var(--mist);
  display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.attn{background:var(--sun-soft);border-color:var(--sun-soft);color:var(--bark)}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Weather */
.wx{background:var(--tide);border-radius:20px;padding:14px 16px;margin-bottom:12px;width:100%;text-align:left;border:none;display:block}
.wx-head{display:flex;justify-content:space-between;font-size:12px;color:var(--haze);margin-bottom:10px}
.wx-days{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wx-day{display:flex;gap:10px;align-items:center}
.wx-emoji{font-size:34px;line-height:1}
.wx-name{font-size:13px;color:var(--mist)}
.wx-temp{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
.wx-temp small{font-family:var(--body);font-size:14px;font-weight:400;color:var(--haze)}
.wx-meta{font-size:12px;color:var(--mist)}
.wx-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.wx-slot{background:var(--deep);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mist)}
.wx-slot b{display:block;font-size:20px;line-height:1.3;font-weight:400}
.wx-slot.bad{outline:1px solid var(--sun-soft)}
.wx-tip{font-size:13px;margin-top:10px;color:var(--foam)}
.wx-label{font-size:12px;color:var(--mist);margin:12px 0 2px}

/* Cards & banners */
.note{border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.note p{margin:0}
.note.sync{background:var(--grape);color:var(--plum)}
.note.due{background:var(--sand);color:var(--bark)}
.note.sample{background:transparent;border:1px dashed var(--haze);color:var(--mist)}
.note.connect{background:transparent;border:1px dashed var(--haze);color:var(--mist);align-items:center}
.note b{font-weight:600}
.x{background:transparent;border:none;color:inherit;font-size:18px;line-height:1;padding:4px 6px;min-width:32px;min-height:32px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-plan{background:#0F6E56;color:#E1F5EE}.p-todo{background:var(--surf);color:var(--foam)}.p-done{background:var(--tide-2);color:var(--mist)}
.p-sync{background:#3C3489;color:#EEEDFE}.p-clash{background:var(--sun-soft);color:var(--bark)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.btn{border:none;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-sun{background:var(--sun-soft);color:var(--bark)}
.btn-foam{background:var(--foam);color:var(--deep)}
.btn-ghost{background:transparent;border:1px solid var(--haze);color:var(--foam);font-weight:500}
.btn-danger{background:transparent;border:1px solid var(--coral);color:var(--coral);font-weight:500}
.btn-sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px;gap:8px}
.sec h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0}
.sec span{font-size:12px;color:var(--haze);text-align:right}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tab{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--wave);background:transparent;color:var(--mist);white-space:nowrap;min-height:34px}
.tab[aria-pressed="true"]{background:var(--foam);color:var(--deep);border-color:var(--foam)}

.item{background:var(--tide);border-radius:16px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.item.plan{border:1px solid var(--mint)}
.item.done{opacity:.55}
.item.done .title{text-decoration:line-through}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--haze);background:transparent;flex:none;display:flex;align-items:center;justify-content:center;color:var(--kelp);padding:0;margin-top:1px}
.ck svg{width:16px;height:16px}
.ck[aria-checked="true"]{background:var(--mint);border-color:var(--mint)}
.body{flex:1;min-width:0;background:none;border:none;padding:0;text-align:left}
.title{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12px;color:var(--mist)}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-High{background:var(--coral);color:var(--ember)}.c-Normal{background:var(--haze);color:var(--deep)}.c-Whenever{background:#B4B2A9;color:#2C2C2A}
.c-mail{background:var(--grape);color:var(--plum)}.c-ol{background:var(--sun-soft);color:var(--bark)}.c-slot{background:var(--mint-soft);color:var(--kelp)}
.c-overdue{background:var(--coral);color:var(--ember)}.c-today{background:var(--sun-soft);color:var(--bark)}
.warn{background:var(--sand);color:var(--bark);font-size:12px;border-radius:10px;padding:6px 8px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.warn button{background:var(--bark);color:var(--sand);border:none;border-radius:8px;font-size:12px;padding:6px 10px;white-space:nowrap;min-height:30px}
.empty{font-size:14px;color:var(--haze);padding:10px 2px}
.foot{display:flex;justify-content:center;gap:10px;margin-top:28px;flex-wrap:wrap}
.foot .btn{font-size:13px}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(1,10,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--deep);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--wave)}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:24px;border:1px solid var(--wave)}}
.sheet h3{font-family:var(--display);font-size:22px;margin:0 0 4px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--wave);margin:-6px auto 12px}
.field{margin-top:14px}
.field>label,.field>.lbl{display:block;font-size:13px;color:var(--haze);margin-bottom:6px}
.in{width:100%;background:var(--night);border:1px solid var(--wave);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px}
textarea.in{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid var(--wave);background:transparent;color:var(--mist);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--foam);color:var(--deep);border-color:var(--foam)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;font-size:15px}
.sw{width:52px;height:32px;border-radius:999px;background:var(--surf);border:none;padding:3px;flex:none;display:flex}
.sw span{width:26px;height:26px;border-radius:50%;background:var(--foam);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--mint)}.sw[aria-checked="true"] span{transform:translateX(20px)}
.hint{font-size:12px;color:var(--haze);margin-top:6px}
.hint.warnc{color:var(--sun-soft)}
.err{font-size:13px;color:var(--coral);margin-top:6px;min-height:0}
.wxline{margin-top:12px;font-size:13px;border-radius:10px;padding:8px 10px}
.wxline.ok{background:#E1F5EE;color:var(--kelp)}.wxline.bad{background:var(--sand);color:var(--bark)}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.sheet-actions .btn{flex:1}
.range{width:100%;accent-color:var(--sun)}
.setgroup{border-top:1px solid var(--tide-2);margin-top:18px;padding-top:6px}
.setgroup h4{font-family:var(--display);font-size:16px;margin:10px 0 0}
.steps{font-size:14px;color:var(--mist);padding-left:20px}
.steps li{margin-bottom:6px}
code{background:var(--night);border-radius:6px;padding:1px 6px;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--mint);color:var(--kelp);
  padding:10px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3)}
a{color:var(--sun-soft)}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<div id="sheet-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="msal-browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
